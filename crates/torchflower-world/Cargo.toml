[package]
name = "torchflower-world"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sparse, memory-bounded Bedrock voxel world (paletted sub-chunks, block registry, raycasts) for TorchFlower bots."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/torchflower-world"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**/*.rs", "data/palettes/*.bin", "tools/*.py", "README.md"]

[dependencies]
flate2 = "1.1"
torchflower-protocol-core = { version = "0.1.0", path = "../torchflower-protocol-core" }
